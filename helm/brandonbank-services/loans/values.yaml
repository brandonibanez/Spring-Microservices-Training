# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: loans-deployment
serviceName: loans
appLabel: loans
appName: loans

replicaCount: 1

image:
  repository: brandonibanez/loans
  tag: s14

containerPort: 8090

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

database:
  host: "loansdb" # This MUST match the 'metadata.name' of your DB Service
  port: "3306"
  name: "loansdb"
  user: "root"
  password: "root"

healthcheck:
  enabled: true
  initialDelay: 60
  command:
    - /bin/sh
    - -c
    - "mysqladmin ping -h localhost -u root --password=$MYSQL_ROOT_PASSWORD"

appname_enabled: true
profile_enabled: true
config_enabled: true
eureka_enabled: true
resouceserver_enabled: false
otel_enabled: true
kafka_enabled: false