# Metadata
deploymentName: accountsdb-deploy
serviceName: accountsdb
appLabel: accountsdb
appName: accountsdb
replicaCount: 1

# Image
image:
  repository: mysql
  tag: "8.0"

# Disable Spring ConfigMap logic
appname_enabled: false
profile_enabled: false
config_enabled: false
discovery_enabled: false
resouceserver_enabled: false
otel_enabled: false
kafka_enabled: false

# DB ENV VARS
extra_vars_enabled: true
extra_vars:
  MYSQL_DATABASE: "accountsdb"
  MYSQL_ROOT_PASSWORD: "root"

# 🚨 FIXED HEALTHCHECK (IMPORTANT CHANGE)
healthcheck:
  enabled: true

  # Give MySQL more time to initialize socket
  initialDelaySeconds: 20
  periodSeconds: 10

  # More stable than mysqladmin during startup
  command:
    - /bin/mysqladmin
    - ping
    - -h
    - 127.0.0.1
    - -uroot
    - -proot

# Ports
containerPort: 3306

service:
  type: ClusterIP
  port: 3306
  targetPort: 3306

global:
  configMapName: global-config